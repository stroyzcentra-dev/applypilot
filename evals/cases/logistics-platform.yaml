company: Routewise
title: Software Engineer, Platform
description: |
  Routewise schedules last-mile deliveries for 400 courier companies. The
  platform team owns the APIs every product team builds on: routing, pricing
  and dispatch. You'll work on request latency, query performance and caching
  across Python services backed by Postgres and Redis. Remote within the US.
questions:
  - label: Cover letter
    kind: long_text
    expect: answer
  - label: How did you hear about this role?
    kind: single_choice
    options: ["LinkedIn", "Referral", "Company careers page", "Other"]
    expect: answer
  - label: Gender
    kind: single_choice
    options: ["Male", "Female", "Non-binary", "Decline to self-identify"]
    expect: skip
  - label: Where will you be working from?
    kind: short_text
    expect: answer
